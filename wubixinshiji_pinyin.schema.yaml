# Rime schema settings
# encoding: utf-8

schema:
  schema_id: wubixinshiji_pinyin
  name: "新世纪五笔·拼音"
  version: "0.9"
  author:
    - 发明人 王永民先生
    - 方案制作人 Federo <federo666@outlook.com>
  description: |
    五笔字型新世纪版＋汉语拼音混合输入。
  dependencies:
    - pinyin_simp

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 西文]
  - name: full_shape
    reset: 0
    states: [半角, 全角]
  - name: extended_charset
    reset: 0
    states: [常用, 增广]
  - name: ascii_punct
    reset: 1
    states: [。，, ．，]
  - name: emoji_suggestion
    reset: 1
    states: ["🈚️️\uFE0E", "🈶️️\uFE0F"]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator # 处理标点
    - script_translator@pinyin # 独立拼音通道，支持整句输入和用户词典学习
    - table_translator # 使用五笔编码查询汉字、词组
  filters:
    - reverse_lookup_filter@wubi_lookup # 给字词候选补充五笔编码，恢复以拼音查五笔
    - simplifier@emoji_suggestion
    - uniquifier # 在 Emoji 转换后合并五笔与拼音的重复候选

speller:
  delimiter: " ;'"
  #max_code_length: 4  # 四码顶字上屏

translator:
  dictionary: wubixinshiji
  initial_quality: 1 # 提高五笔候选基础优先级，保持五笔为主
  prism: wubixinshiji_pinyin
  enable_charset_filter: true
  enable_sentence: true
  enable_encoder: true
  encode_commit_history: true
  max_phrase_length: 4
  disable_user_dict_for_patterns:
    - "^z.*$"

pinyin:
  dictionary: pinyin_simp
  prism: pinyin_simp # 复用拼音方案的拼写规则，不改变五笔编码规则
  user_dict: pinyin_simp # 与独立拼音方案共享用户词典
  enable_user_dict: true # 学习用户选词和词组
  enable_sentence: true # 允许拼音整句输入
  enable_completion: false # 不用未输入完整的拼音补全挤占候选
  initial_quality: -1 # 拼音作为辅助通道，基础优先级低于五笔
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

wubi_lookup:
  dictionary: wubixinshiji # 根据候选文字查询五笔词典中的编码
  tags: [abc] # 仅处理字母输入的字词候选，不处理标点
  overwrite_comment: true # 用五笔编码替换原注释，避免拼音提示遮住反查结果
  comment_format:
    - "xform/^/〔五笔〕/" # 明确标注编码来源；词典没有对应词条时不添加提示

punctuator:
  __include: default:/punctuator # 先加载默认标点表，再覆盖反引号，保留其他标点
  __patch:
    "half_shape/`": {commit: "`"} # 半角模式直接上屏反引号
    "full_shape/`": {commit: "`"} # 全角模式也输出 ASCII 反引号

key_binder:
  import_preset: default

recognizer:
  import_preset: default

emoji_suggestion:
  opencc_config: emoji.json
  option_name: emoji_suggestion
  tips: all
